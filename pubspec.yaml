name: ass_sauvegarde_sites
description: Offline operations app for appointments, tasks, payroll reports, and asset tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - docs/icon.png
    - docs/featured.png

flutter_launcher_icons:
  android: true
  image_path: docs/icon.png
  adaptive_icon_background: "#8BC34A"
  adaptive_icon_foreground: docs/icon.png
